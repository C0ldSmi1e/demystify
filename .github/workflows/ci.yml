name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        env:
          # The browser of a hosted Linux runner cannot start its own sandbox.
          DEMYSTIFY_BROWSER_ARGS: ${{ runner.os == 'Linux' && '--no-sandbox' || '' }}
        run: python -m unittest discover -s tests -v

  claude-code:
    name: installs in Claude Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate
        run: claude plugin validate --strict .
      - name: Install into a scratch config and confirm that it is enabled
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install demystify@demystify
          claude plugin list | tee list.txt
          grep -q "enabled" list.txt

  codex:
    name: installs in Codex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @openai/codex
      - name: Install into a scratch home and confirm that it is enabled
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codex"
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          codex plugin add demystify@demystify
          codex plugin list | tee list.txt
          grep -q "installed, enabled" list.txt

  skills-installer:
    name: installs with npx skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install into an empty project and compare with the source
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          mkdir "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          npx -y skills@latest add "$GITHUB_WORKSPACE" -a codex -a cursor -y
          diff -r .agents/skills/demystify "$GITHUB_WORKSPACE/skills/demystify"

  gemini:
    name: valid Gemini CLI extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npx -y @google/gemini-cli@latest extensions validate "$GITHUB_WORKSPACE"

  video:
    name: renders a video (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-dev pkg-config libcairo2-dev libpango1.0-dev
      - name: System libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pkg-config
      - run: python -m pip install uv
      - name: The doctor says that video is ready
        run: python skills/demystify/scripts/doctor.py
      - name: Render real videos
        env:
          DEMYSTIFY_SLOW_TESTS: "1"
        run: python -m unittest discover -s tests -p 'test_video_integration.py' -v
